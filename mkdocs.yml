      - Configuration: getting-started/configuration.md
      - Core Concepts: getting-started/concepts.md
  
  - Guides:
      - LCEL Composition: guides/lcel-composition.md
      - Chain Types: guides/chain-types.md
      - Memory Integration: guides/memory-integration.md
      - Agent Development: guides/agent-development.md
      - Async Usage: guides/async-usage.md
      - Error Handling: guides/error-handling.md
      - Callbacks: guides/callbacks.md
      - Production Deployment: guides/production-deployment.md
  
  - API Reference:
      - Chains:
          - Base Chain: api-reference/chains/base.md
          - LLM Chain: api-reference/chains/llm-chain.md
          - Sequential Chains: api-reference/chains/sequential.md
          - Retrieval Chain: api-reference/chains/retrieval.md
          - Specialized Chains: api-reference/chains/specialized/
      
      - Runnables:
          - Base Runnable: api-reference/runnables/base.md
          - Composition: api-reference/runnables/composition.md
          - Utilities: api-reference/runnables/utilities.md
      
      - Prompts:
          - Templates: api-reference/prompts/templates.md
          - Message Types: api-reference/prompts/message-types.md
      
      - Agents:
          - Agent Types: api-reference/agents/agent-types.md
          - Tools: api-reference/agents/tools.md
      
      - Memory:
          - Buffer Memory: api-reference/memory/buffer-memory.md
      
      - Callbacks:
          - Handlers: api-reference/callbacks/handlers.md
      
      - Utilities:
          - Output Parsers: api-reference/utilities/output-parsers.md
  
  - Architecture:
      - Overview: architecture/overview.md
      - Chain Lifecycle: architecture/chain-lifecycle.md
      - LCEL Type System: architecture/lcel-type-system.md
      - Callback System: architecture/callback-system.md
      - Message Flow: architecture/message-flow.md
  
  - Debugging:
      - Common Issues: debugging/common-issues.md
      - Logging: debugging/logging.md
      - Stack Traces: debugging/stack-traces.md
      - Troubleshooting: debugging/troubleshooting.md
  
  - Contributing:
      - Documentation: contributing/documentation.md
      - Testing: contributing/testing.md

# Build Configuration
strict: true                    # Fail build on warnings
use_directory_urls: true        # Use directory URLs

# Watch Configuration (for mkdocs serve)
watch:
  - docs/
  - examples/
